<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Theater by FYDY</title>
    <meta name="description" content="Theater — AI for Discovery & Experimentation." />
    <meta name="author" content="Theater" />
    <link rel="icon" type="image/svg+xml" href="/logo.svg" />

    <meta property="og:title" content="Theater — AI for Discovery" />
    <meta property="og:description" content="Theater — AI for Discovery & Experimentation." />
    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />

    <!-- Google Fonts for handwritten and old printing press effect -->
    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Caveat:wght@400;500;600;700&family=Indie+Flower&family=Kalam:wght@300;400;700&family=Patrick+Hand&family=EB+Garamond:wght@400;500;600;700&family=Libre+Baskerville:wght@400;700&family=Crimson+Text:wght@400;600;700&display=swap" rel="stylesheet">

    <!-- Prevent theme flash by disabling transitions during load -->
    <script>
      (function() {
        // Temporarily disable all transitions to prevent flash
        const style = document.createElement('style');
        style.innerHTML = '*, *::before, *::after { transition: none !important; }';
        document.head.appendChild(style);
        
        // Set theme immediately
        const storageKey = 'Theater-ui-theme';
        let theme = localStorage.getItem(storageKey);
        
        if (!theme || (theme !== 'light' && theme !== 'dark')) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        
        document.documentElement.classList.add(theme);
        
        // Re-enable transitions after load
        window.addEventListener('DOMContentLoaded', function() {
          setTimeout(() => document.head.removeChild(style), 50);
        });
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
