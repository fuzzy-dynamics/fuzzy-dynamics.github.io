    <meta property="og:title" content="Theatre — Make a Thing" />

    <meta property="og:type" content="website" />

    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Prevent theme flash by disabling transitions during load -->
    <script>
      (function() {
        // Temporarily disable all transitions to prevent flash
        const style = document.createElement('style');
        style.innerHTML = '*, *::before, *::after { transition: none !important; }';
        document.head.appendChild(style);
        
        // Set theme immediately
        const storageKey = 'theatre-ui-theme';
        let theme = localStorage.getItem(storageKey);
        
        if (!theme || (theme !== 'light' && theme !== 'dark')) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        
        document.documentElement.classList.add(theme);
        
        // Re-enable transitions after load
        window.addEventListener('DOMContentLoaded', function() {
          setTimeout(() => document.head.removeChild(style), 50);
        });
      })();
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
