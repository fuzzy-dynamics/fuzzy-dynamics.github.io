    <meta name="twitter:card" content="summary_large_image" />
    
    <!-- Prevent theme flash by disabling transitions during load -->
    <script>
      (function() {
        // Temporarily disable all transitions to prevent flash
        const style = document.createElement('style');
        style.innerHTML = '*, *::before, *::after { transition: none !important; }';
        document.head.appendChild(style);
        
        // Set theme immediately
        const storageKey = 'theatre-ui-theme';
        let theme = localStorage.getItem(storageKey);
        
        if (!theme || (theme !== 'light' && theme !== 'dark')) {
          theme = window.matchMedia('(prefers-color-scheme: dark)').matches ? 'dark' : 'light';
        }
        
        document.documentElement.classList.add(theme);
        
        // Re-enable transitions after load
        window.addEventListener('DOMContentLoaded', function() {
          setTimeout(() => document.head.removeChild(style), 50);
        });
      })();
    </script>
    
    <!-- GitHub Pages SPA redirect script -->
    <script>
      // Single Page Apps for GitHub Pages
      // https://github.com/rafgraph/spa-github-pages
      // Start redirect script
      var pathSegmentsToKeep = 0;

      var l = window.location;
      l.replace(
        l.protocol + '//' + l.hostname + (l.port ? ':' + l.port : '') +
        l.pathname.split('/').slice(0, 1 + pathSegmentsToKeep).join('/') + '/?/' +
        l.pathname.slice(1).split('/').slice(pathSegmentsToKeep).join('/').replace(/&/g, '~and~') +
        (l.search ? '&' + l.search.slice(1).replace(/&/g, '~and~') : '') +
        l.hash
      );
    </script>
  </head>

  <body>
    <div id="root"></div>
    <script type="module" src="/src/main.tsx"></script>
  </body>
</html>
